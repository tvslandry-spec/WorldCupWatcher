<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ContiStream Overlay</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; background:transparent; font-family:Arial Black,Arial,sans-serif; overflow:hidden; position:relative; }

.widget {
  position: absolute;
  top: 8px;
  right: 24px;
  width: 380px;
  background: rgba(14,5,32,0.93);
  border: 2px solid #c9a84c;
  border-radius: 10px;
  overflow: hidden;
  transform: scale(1.37);
  transform-origin: top right;
}

.widget-title { background:#c9a84c; display:flex; align-items:center; justify-content:space-between; padding:4px 10px; }
.widget-title-left { font-size:9px; font-weight:900; color:#1a0a2e; letter-spacing:1.5px; text-transform:uppercase; }
.widget-title-right { font-size:9px; font-weight:900; color:#1a0a2e; letter-spacing:1px; }
.sub-row { display:flex; align-items:center; gap:8px; padding:5px 10px; border-bottom:1px solid rgba(201,168,76,0.2); }
.sub-label { font-size:8px; font-weight:900; color:#c9a84c; letter-spacing:1px; text-transform:uppercase; white-space:nowrap; }
.sub-track { flex:1; height:6px; background:#2d1054; border-radius:3px; overflow:hidden; }
.sub-fill { height:100%; background:linear-gradient(to right,#9b4dca,#c9a84c); border-radius:3px; transition:width 1s ease; width:41.2%; }
.sub-count { font-size:9px; font-weight:900; color:#f5d078; white-space:nowrap; }
.score-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:8px 10px; border-bottom:1px solid rgba(201,168,76,0.2); gap:6px; }
.team-home { display:flex; align-items:center; gap:5px; overflow:hidden; }
.team-away { display:flex; align-items:center; gap:5px; flex-direction:row-reverse; overflow:hidden; }
.flag { font-size:14px; flex-shrink:0; }
.team-name { font-size:13px; font-weight:900; color:#fff; letter-spacing:1px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.scores { display:flex; align-items:center; justify-content:center; }
.score-box { background:#2d1054; border:1.5px solid #c9a84c; border-radius:4px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
.score-num { font-size:18px; font-weight:900; color:#f5d078; }
.score-dash { font-size:10px; color:#c9a84c; padding:0 4px; }
.meta-row { display:grid; grid-template-columns:80px 1fr 90px; align-items:center; padding:5px 10px; border-bottom:1px solid rgba(201,168,76,0.2); }
.status-label { font-size:9px; font-weight:900; color:#c9a84c; letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; }
.status-label.live { color:#ff4444; animation:pulse 1.4s ease-in-out infinite; }
.status-label.ht { color:#ff9900; }
.status-label.et { color:#9b4dca; }
.clock-label { font-size:13px; font-weight:900; color:#f5d078; letter-spacing:1px; text-align:center; }
.clock-label.running { color:#ff6666; }
.pushup-badge { display:flex; align-items:center; gap:3px; background:rgba(201,168,76,0.12); border:1px solid rgba(201,168,76,0.4); border-radius:4px; padding:2px 5px; justify-content:flex-end; width:88px; overflow:hidden; }
.pushup-badge-icon { font-size:10px; flex-shrink:0; }
.pushup-badge-count { font-size:11px; font-weight:900; color:#f5d078; flex-shrink:0; }
.pushup-badge-count.pop { animation:pop 0.5s ease; }
.pushup-badge-label { font-size:7px; color:#9b7fd4; letter-spacing:0.5px; text-transform:uppercase; white-space:nowrap; flex-shrink:0; }
.chat-area { padding:5px 10px 6px; display:flex; flex-direction:column; gap:3px; min-height:50px; }
.chat-msg { font-family:Arial,sans-serif; font-size:11px; line-height:1.3; word-break:break-word; animation:fadeIn 0.3s ease; text-shadow:1px 1px 2px rgba(0,0,0,0.9),-1px -1px 2px rgba(0,0,0,0.9); }
.chat-msg .username { font-weight:900; margin-right:3px; }
.chat-msg .text { color:#fff; font-weight:400; }

.badge-wrap { position:absolute; bottom:24px; left:24px; width:160px; height:160px; display:flex; align-items:center; justify-content:center; }
.badge-spin { width:160px; height:160px; animation:spin360 6s linear infinite; filter:drop-shadow(0 0 14px rgba(201,168,76,0.45)); }
@keyframes spin360 { from{transform:rotateY(0deg)} to{transform:rotateY(360deg)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
@keyframes pop { 0%{transform:scale(1);color:#f5d078} 30%{transform:scale(1.5);color:#ff4444} 60%{transform:scale(0.9);color:#ff9900} 100%{transform:scale(1);color:#f5d078} }
@keyframes fadeIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>

</div>

<script>
  var SUPABASE_URL='https://oaxfnqxcitaqtgewkjsb.supabase.co';
  var SUPABASE_KEY='sb_publishable_VlABBj1OgQhWQ9sdjuTFNQ_lh2LI_U1';
  var API=SUPABASE_URL+'/rest/v1/Scores?order=id.desc&limit=1';
  var PAIR='r16_04';
  var STATUS_LABELS=['Pre-Match','LIVE','Half Time','Full Time','Extra Time','Penalties'];
  var clocks={g1:{running:false,base:0,startedAt:0}};

  function pad(n){return n<10?'0'+n:''+n;}
  function currentSecs(g){var c=clocks[g];return c.running?c.base+Math.floor((Date.now()-c.startedAt)/1000):c.base;}
  function fmtSecs(s){return pad(Math.floor(s/60))+':'+pad(s%60);}

  function updatePushups(t){
    var p=t*10,el=document.getElementById('pushup-count'),prev=parseInt(el.textContent)||0;
    el.textContent=p;
    if(p!==prev){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
  }

  function applyState(d){
    if(!d||d.pair!==PAIR)return;
    var h=d.g1.home||0,a=d.g1.away||0;
    document.getElementById('g1-home').textContent=h;
    document.getElementById('g1-away').textContent=a;
    updatePushups(h+a);
    var lbl=STATUS_LABELS[d.g1.statusIdx]||'Pre-Match';
    var el=document.getElementById('g1-status');
    el.textContent=lbl;
    el.className='status-label'+(lbl==='LIVE'?' live':lbl==='Half Time'?' ht':lbl==='Extra Time'?' et':'');
    var c=d.g1.clock||{running:false,base:0,startedAt:0};
    clocks.g1={running:c.running,base:c.base,startedAt:c.startedAt};
  }

  function poll(){
    fetch(API,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}})
      .then(function(r){return r.json();})
      .then(function(d){if(d&&d[0])applyState(JSON.parse(d[0].data));})
      .catch(function(){});
  }

  setInterval(function(){
    var el=document.getElementById('g1-clock');
    el.textContent=fmtSecs(currentSecs('g1'));
    el.className='clock-label'+(clocks.g1.running?' running':'');
  },500);

  poll(); setInterval(poll,2000);

  function pollSubs(){
    fetch('https://api.twitch.tv/helix/subscriptions?broadcaster_id=1508126715&first=1',{
      headers:{'Client-Id':'d4anlmidokt295jqvvtixt0tarzvkb','Authorization':'Bearer dsvcnmtdsh2ib2rfdywat0zsapaol5'}
    }).then(function(r){return r.json();})
    .then(function(d){
      if(d&&typeof d.total==='number'){
        var pct=Math.min(100,(d.total/1000)*100);
        document.getElementById('sub-count').textContent=d.total+' / 1000';
        document.getElementById('sub-fill').style.width=pct.toFixed(1)+'%';
      }
    }).catch(function(){});
  }
  pollSubs(); setInterval(pollSubs,30000);

  var msgs=[],MAX_MSGS=4;
  var COLORS=['#ff9f9f','#9fff9f','#9f9fff','#ffd49f','#d49fff','#9fffff','#ff9fd4','#ffff9f'];
  var userColors={};
  function getUserColor(n){if(!userColors[n]){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))&0xffffffff;userColors[n]=COLORS[Math.abs(h)%COLORS.length];}return userColors[n];}
  function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function addMessage(u,t){
    var c=document.getElementById('chat-messages'),d=document.createElement('div');
    d.className='chat-msg';
    d.innerHTML='<span class="username" style="color:'+getUserColor(u)+'">'+escHtml(u)+':</span><span class="text"> '+escHtml(t)+'</span>';
    c.appendChild(d);msgs.push(d);if(msgs.length>MAX_MSGS)msgs.shift().remove();
  }
  function connectChat(){
    var ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
