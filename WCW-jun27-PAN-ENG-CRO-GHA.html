<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ContiStream Overlay</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:transparent; font-family:Arial Black,Arial,sans-serif; display:flex; flex-direction:column; gap:10px; padding:16px; width:560px; }
.sb-card { background:rgba(26,10,46,0.92); border:2px solid #c9a84c; border-radius:10px; overflow:hidden; }
.sb-header { background:#c9a84c; display:flex; align-items:center; justify-content:center; gap:8px; padding:4px 12px; }
.sb-header-label { font-size:11px; font-weight:900; color:#1a0a2e; letter-spacing:1.5px; text-transform:uppercase; }
.sb-body { display:flex; align-items:center; padding:10px 14px; gap:8px; }
.sb-team { display:flex; align-items:center; gap:8px; flex:1; }
.sb-team.right { flex-direction:row-reverse; }
.sb-flag { font-size:22px; flex-shrink:0; }
.sb-name { font-size:20px; font-weight:900; color:#fff; letter-spacing:1.5px; text-transform:uppercase; }
.sb-scores { display:flex; align-items:center; flex-shrink:0; }
.sb-score-box { background:#2d1054; border:1.5px solid #c9a84c; border-radius:6px; width:44px; height:48px; display:flex; align-items:center; justify-content:center; }
.sb-score { font-size:28px; font-weight:900; color:#f5d078; }
.sb-vs { font-size:13px; font-weight:700; color:#c9a84c; padding:0 7px; opacity:0.8; }
.sb-footer { display:flex; align-items:center; justify-content:space-between; padding:4px 14px 8px; }
.sb-status { font-size:11px; font-weight:900; color:#c9a84c; letter-spacing:1.5px; text-transform:uppercase; }
.sb-status.live { color:#ff4444; animation:pulse 1.4s ease-in-out infinite; }
.sb-status.ht { color:#ff9900; }
.sb-clock { font-size:14px; font-weight:900; color:#f5d078; letter-spacing:1px; }
.sb-clock.running { color:#ff6666; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Transparent chat */
.chat-panel { width:100%; display:flex; flex-direction:column; height:100px; overflow:hidden; position:relative; }
.chat-messages { flex:1; overflow:hidden; padding:4px 8px; display:flex; flex-direction:column; justify-content:flex-end; gap:4px; }
.chat-msg { font-family:Arial,sans-serif; font-size:13px; line-height:1.5; word-break:break-word; animation:fadeIn 0.3s ease; text-shadow:1px 1px 3px rgba(0,0,0,0.95),-1px -1px 3px rgba(0,0,0,0.95),1px -1px 3px rgba(0,0,0,0.95),-1px 1px 3px rgba(0,0,0,0.95); }
.chat-msg .username { font-weight:900; margin-right:4px; }
.chat-msg .text { color:#ffffff; font-weight:400; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

/* Sub ticker bar */
.sub-bar {
  width:100%;
  background:rgba(26,10,46,0.92);
  border:2px solid #c9a84c;
  border-radius:8px;
  overflow:hidden;
  height:32px;
  display:flex;
  align-items:center;
  position:relative;
}
.sub-bar-inner {
  display:flex;
  align-items:center;
  white-space:nowrap;
  position:absolute;
  left:100%;
  animation:ticker 18s linear infinite;
  gap:60px;
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:700;
  color:#f5d078;
  letter-spacing:0.5px;
}
.sub-bar-inner .sub-item { display:inline-flex; align-items:center; gap:6px; }
.sub-bar-inner .sub-name { color:#ffffff; }
.sub-bar-inner .sub-type { color:#c9a84c; font-size:11px; }
@keyframes ticker { 0%{left:100%} 100%{left:-200%} }
.sub-bar-label {
  position:absolute;
  left:0; top:0; bottom:0;
  background:#c9a84c;
  display:flex; align-items:center;
  padding:0 10px;
  font-size:10px;
  font-weight:900;
  color:#1a0a2e;
  letter-spacing:1.5px;
  text-transform:uppercase;
  z-index:2;
  white-space:nowrap;
}
</style>
</head>
<body>

<!-- SUB TICKER -->
<div class="sub-bar">
  <div class="sub-bar-label">&#127942; New Subs</div>
  <div class="sub-bar-inner" id="sub-ticker">
    <span class="sub-item"><span>&#8212;</span><span class="sub-name">Waiting for subscribers...</span></span>
  </div>
</div>

<!-- GAME 1 -->
<div class="sb-card">
  <div class="sb-header"><span>&#127942;</span><span class="sb-header-label">FIFA World Cup 2026 &mdash; Group Stage</span><span>&#127942;</span></div>
  <div class="sb-body">
    <div class="sb-team"><span class="sb-flag">&#x1F1F5;&#x1F1E6;</span><span class="sb-name">PAN</span></div>
    <div class="sb-scores">
      <div class="sb-score-box"><span class="sb-score" id="g1-home">0</span></div>
      <span class="sb-vs">&mdash;</span>
      <div class="sb-score-box"><span class="sb-score" id="g1-away">0</span></div>
    </div>
    <div class="sb-team right"><span class="sb-flag">&#x1F3F4;</span><span class="sb-name">ENG</span></div>
  </div>
  <div class="sb-footer"><span class="sb-status" id="g1-status">Pre-Match</span><span class="sb-clock" id="g1-clock">00:00</span></div>
</div>

<!-- GAME 2 -->
<div class="sb-card">
  <div class="sb-header"><span>&#127942;</span><span class="sb-header-label">FIFA World Cup 2026 &mdash; Group Stage</span><span>&#127942;</span></div>
  <div class="sb-body">
    <div class="sb-team"><span class="sb-flag">&#x1F1ED;&#x1F1F7;</span><span class="sb-name">CRO</span></div>
    <div class="sb-scores">
      <div class="sb-score-box"><span class="sb-score" id="g2-home">0</span></div>
      <span class="sb-vs">&mdash;</span>
      <div class="sb-score-box"><span class="sb-score" id="g2-away">0</span></div>
    </div>
    <div class="sb-team right"><span class="sb-flag">&#x1F1EC;&#x1F1ED;</span><span class="sb-name">GHA</span></div>
  </div>
  <div class="sb-footer"><span class="sb-status" id="g2-status">Pre-Match</span><span class="sb-clock" id="g2-clock">00:00</span></div>
</div>

<!-- TRANSPARENT CHAT -->
<div class="chat-panel">
  <div class="chat-messages" id="chat-messages"></div>
</div>

<script>
  // ── SCOREBOARD ───────────────────────────────────────────────
  var SUPABASE_URL = 'https://oaxfnqxcitaqtgewkjsb.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_VlABBj1OgQhWQ9sdjuTFNQ_lh2LI_U1';
  var API = SUPABASE_URL + '/rest/v1/Scores?order=id.desc&limit=1';
  var PAIR = 'jun27p1';
  var STATUS_LABELS = ['Pre-Match','LIVE','Half Time','Full Time'];
  var clocks = { g1:{running:false,base:0,startedAt:0}, g2:{running:false,base:0,startedAt:0} };

  function pad(n){ return n<10?'0'+n:''+n; }
  function currentSecs(g){ var c=clocks[g]; return c.running?c.base+Math.floor((Date.now()-c.startedAt)/1000):c.base; }
  function fmtSecs(s){ return pad(Math.floor(s/60))+':'+pad(s%60); }

  function applyState(d) {
    if (!d||d.pair!==PAIR) return;
    ['g1','g2'].forEach(function(g){
      document.getElementById(g+'-home').textContent=d[g].home;
      document.getElementById(g+'-away').textContent=d[g].away;
      var lbl=STATUS_LABELS[d[g].statusIdx]||'Pre-Match';
      var el=document.getElementById(g+'-status');
      el.textContent=lbl;
      el.className='sb-status'+(lbl==='LIVE'?' live':lbl==='Half Time'?' ht':'');
      var c=d[g].clock||{running:false,base:0,startedAt:0};
      clocks[g]={running:c.running,base:c.base,startedAt:c.startedAt};
    });
  }

  function poll(){
    fetch(API,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}})
      .then(function(r){return r.json();})
      .then(function(d){if(d&&d[0])applyState(JSON.parse(d[0].data));})
      .catch(function(){});
  }

  setInterval(function(){
    ['g1','g2'].forEach(function(g){
      var el=document.getElementById(g+'-clock');
      el.textContent=fmtSecs(currentSecs(g));
      el.className='sb-clock'+(clocks[g].running?' running':'');
    });
  },500);

  poll(); setInterval(poll,2000);

  // ── TWITCH CHAT ──────────────────────────────────────────────
  var CHANNEL = 'contikolokotronis';
  var MAX_MSGS = 4;
  var msgs = [];
  var COLORS = ['#ff9f9f','#9fff9f','#9f9fff','#ffd49f','#d49fff','#9fffff','#ff9fd4','#ffff9f','#9fd4ff'];
  var userColors = {};

  function getUserColor(name) {
    if (!userColors[name]) {
      var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))&0xffffffff;
      userColors[name]=COLORS[Math.abs(h)%COLORS.length];
    }
    return userColors[name];
  }

  function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function addMessage(username, text) {
    var container=document.getElementById('chat-messages');
    var div=document.createElement('div');
    div.className='chat-msg';
    div.innerHTML='<span class="username" style="color:'+getUserColor(username)+'">'+escHtml(username)+':</span><span class="text"> '+escHtml(text)+'</span>';
    container.appendChild(div);
    msgs.push(div);
    if(msgs.length>MAX_MSGS){ msgs.shift().remove(); }
  }

  function connectChat() {
    var ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen=function(){
      ws.send('PASS oauth:twitch_anonymous');
      ws.send('NICK justinfan'+Math.floor(Math.random()*99999));
      ws.send('JOIN #contikolokotronis');
    };
    ws.onmessage=function(e){
      var raw=e.data;
      if(raw.indexOf('PING')===0){ ws.send('PONG :tmi.twitch.tv'); return; }
      var m=raw.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.+)$/m);
      if(m){ addMessage(m[1],m[2].trim()); }
    };
    ws.onclose=function(){ setTimeout(connectChat,3000); };
    ws.onerror=function(){ ws.close(); };
  }

  connectChat();

  // ── SUB TICKER ───────────────────────────────────────────────
  var CLIENT_ID = 'd4anlmidokt295jqvvtixt0tarzvkb';
  var TOKEN = 'dsvcnmtdsh2ib2rfdywat0zsapaol5';
  var USER_ID = '1508126715';
  var subQueue = [];
  var lastSubCursor = null;

  function addSubToTicker(name, tier) {
    subQueue.push({name:name, tier:tier});
    renderTicker();
  }

  function tierLabel(tier) {
    if (tier === '1000') return 'Tier 1 Sub';
    if (tier === '2000') return 'Tier 2 Sub';
    if (tier === '3000') return 'Tier 3 Sub';
    return 'Subscriber';
  }

  function renderTicker() {
    var ticker = document.getElementById('sub-ticker');
    if (subQueue.length === 0) {
      ticker.innerHTML = '<span class="sub-item"><span>&#8212;</span><span class="sub-name">Waiting for subscribers...</span></span>';
      return;
    }
    var html = '';
    subQueue.forEach(function(s) {
      html += '<span class="sub-item">&#127881; <span class="sub-name">'+escHtml(s.name)+'</span> <span class="sub-type">'+s.tier+'</span></span>';
    });
    // Duplicate for seamless loop
    ticker.innerHTML = html + html;
  }

  function pollSubs() {
    var url = 'https://api.twitch.tv/helix/subscriptions?broadcaster_id='+USER_ID+'&first=5';
    fetch(url, {
      headers: {
        'Client-Id': CLIENT_ID,
        'Authorization': 'Bearer ' + TOKEN
      }
    })
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (!data.data) return;
      var newSubs = [];
      data.data.forEach(function(sub) {
        if (sub.user_name.toLowerCase() !== 'contikolokotronis') {
          newSubs.push({name:sub.user_name, tier:tierLabel(sub.tier)});
        }
      });
      if (newSubs.length > 0) {
        subQueue = newSubs.slice(0, 10);
        renderTicker();
      }
    })
    .catch(function(){});
  }

  pollSubs();
  setInterval(pollSubs, 30000);
</script>
</body>
</html>
