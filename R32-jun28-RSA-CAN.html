<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>ContiStream Overlay</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:transparent; font-family:Arial Black,Arial,sans-serif; display:flex; flex-direction:row; align-items:flex-start; gap:8px; padding:12px; width:525px; }
.pushup-panel { width:82px; flex-shrink:0; }
.pushup-card { background:rgba(26,10,46,0.92); border:2px solid #c9a84c; border-radius:10px; width:100%; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:3px; }
.pushup-label { font-size:8px; font-weight:900; color:#c9a84c; letter-spacing:1px; text-transform:uppercase; text-align:center; }
.pushup-icon { font-size:20px; line-height:1; }
.pushup-count { font-size:28px; font-weight:900; color:#f5d078; line-height:1; }
.pushup-count.pop { animation:pop 0.5s ease; }
@keyframes pop { 0%{transform:scale(1);color:#f5d078;} 30%{transform:scale(1.4);color:#ff4444;} 60%{transform:scale(0.9);color:#ff9900;} 100%{transform:scale(1);color:#f5d078;} }
.pushup-sub { font-size:8px; color:#9b7fd4; letter-spacing:1px; text-align:center; text-transform:uppercase; }
.pushup-per-goal { font-size:7px; color:#6b4fa0; text-align:center; }
.right-col { flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
.sb-card { background:rgba(26,10,46,0.92); border:2px solid #c9a84c; border-radius:8px; overflow:hidden; }
.sb-header { background:#c9a84c; display:flex; align-items:center; justify-content:center; gap:6px; padding:3px 8px; }
.sb-header-label { font-size:9px; font-weight:900; color:#1a0a2e; letter-spacing:1px; text-transform:uppercase; }
.sb-body { display:flex; align-items:center; padding:7px 10px; gap:6px; }
.sb-team { display:flex; align-items:center; gap:5px; flex:1; min-width:0; }
.sb-team.right { flex-direction:row-reverse; }
.sb-flag { font-size:16px; flex-shrink:0; }
.sb-name { font-size:14px; font-weight:900; color:#fff; letter-spacing:1px; text-transform:uppercase; white-space:nowrap; overflow:hidden; }
.sb-scores { display:flex; align-items:center; flex-shrink:0; }
.sb-score-box { background:#2d1054; border:1.5px solid #c9a84c; border-radius:5px; width:34px; height:36px; display:flex; align-items:center; justify-content:center; }
.sb-score { font-size:22px; font-weight:900; color:#f5d078; }
.sb-vs { font-size:10px; font-weight:700; color:#c9a84c; padding:0 4px; opacity:0.8; }
.sb-footer { display:flex; align-items:center; justify-content:space-between; padding:3px 10px 6px; }
.sb-status { font-size:9px; font-weight:900; color:#c9a84c; letter-spacing:1px; text-transform:uppercase; }
.sb-status.live { color:#ff4444; animation:pulse 1.4s ease-in-out infinite; }
.sb-status.ht { color:#ff9900; }
.sb-clock { font-size:11px; font-weight:900; color:#f5d078; letter-spacing:1px; }
.sb-clock.running { color:#ff6666; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.sub-goal-card { background:rgba(26,10,46,0.92); border:2px solid #c9a84c; border-radius:8px; padding:6px 10px 8px; }
.sub-goal-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.sub-goal-label { font-size:8px; font-weight:900; color:#c9a84c; letter-spacing:1px; text-transform:uppercase; }
.sub-goal-count { font-size:10px; font-weight:900; color:#f5d078; }
.sub-goal-track { width:100%; height:8px; background:#2d1054; border-radius:4px; overflow:hidden; border:1px solid #3a1f6e; }
.sub-goal-fill { height:100%; background:linear-gradient(to right,#9b4dca,#c9a84c); border-radius:4px; transition:width 1s ease; width:40.6%; }
.round-badge { background:rgba(201,168,76,0.15); border:1px solid #c9a84c; border-radius:5px; padding:2px 8px; font-size:8px; font-weight:900; color:#c9a84c; letter-spacing:1px; text-transform:uppercase; text-align:center; }
.chat-panel { width:100%; height:60px; overflow:hidden; display:flex; flex-direction:column; }
.chat-messages { flex:1; overflow:hidden; padding:3px 6px; display:flex; flex-direction:column; justify-content:flex-end; gap:3px; }
.chat-msg { font-family:Arial,sans-serif; font-size:11px; line-height:1.3; word-break:break-word; animation:fadeIn 0.3s ease; text-shadow:1px 1px 3px rgba(0,0,0,0.95),-1px -1px 3px rgba(0,0,0,0.95),1px -1px 3px rgba(0,0,0,0.95),-1px 1px 3px rgba(0,0,0,0.95); }
.chat-msg .username { font-weight:900; margin-right:3px; }
.chat-msg .text { color:#fff; font-weight:400; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
</style></head>
<body>

<div class="pushup-panel">
  <div class="pushup-card">
    <div class="pushup-label">Conti Push-ups</div>
    <div class="pushup-icon">&#x1F4AA;</div>
    <div class="pushup-count" id="pushup-count">0</div>
    <div class="pushup-sub">Total</div>
    <div class="pushup-per-goal">+10/goal</div>
  </div>
</div>

<div class="right-col">
  <div class="sub-goal-card">
    <div class="sub-goal-top"><span class="sub-goal-label">&#127942; Sub Goal</span><span class="sub-goal-count" id="sub-count">406 / 1000</span></div>
    <div class="sub-goal-track"><div class="sub-goal-fill" id="sub-fill"></div></div>
  </div>
  <div class="round-badge">&#9876; Round of 32 &mdash; Knockout Stage</div>
  <div class="sb-card">
    <div class="sb-header"><span>&#127942;</span><span class="sb-header-label">FIFA World Cup 2026 &mdash; Round of 32</span><span>&#127942;</span></div>
    <div class="sb-body">
      <div class="sb-team"><span class="sb-flag">&#x1F1FF;&#x1F1E6;</span><span class="sb-name">RSA</span></div>
      <div class="sb-scores"><div class="sb-score-box"><span class="sb-score" id="g1-home">0</span></div><span class="sb-vs">&mdash;</span><div class="sb-score-box"><span class="sb-score" id="g1-away">0</span></div></div>
      <div class="sb-team right"><span class="sb-flag">&#x1F1E8;&#x1F1E6;</span><span class="sb-name">CAN</span></div>
    </div>
    <div class="sb-footer"><span class="sb-status" id="g1-status">Pre-Match</span><span class="sb-clock" id="g1-clock">00:00</span></div>
  </div>
  <div class="chat-panel"><div class="chat-messages" id="chat-messages"></div></div>
</div>
<script>
  var SUPABASE_URL='https://oaxfnqxcitaqtgewkjsb.supabase.co';
  var SUPABASE_KEY='sb_publishable_VlABBj1OgQhWQ9sdjuTFNQ_lh2LI_U1';
  var API=SUPABASE_URL+'/rest/v1/Scores?order=id.desc&limit=1';
  var PAIR='r32_01';
  var STATUS_LABELS=['Pre-Match','LIVE','Half Time','Full Time','Extra Time','Penalties'];
  var clocks={g1:{running:false,base:0,startedAt:0},g2:{running:false,base:0,startedAt:0}};

  function pad(n){return n<10?'0'+n:''+n;}
  function currentSecs(g){var c=clocks[g];return c.running?c.base+Math.floor((Date.now()-c.startedAt)/1000):c.base;}
  function fmtSecs(s){return pad(Math.floor(s/60))+':'+pad(s%60);}

  function updatePushups(totalGoals){
    var pushups=totalGoals*10;
    var el=document.getElementById('pushup-count');
    var prev=parseInt(el.textContent)||0;
    el.textContent=pushups;
    if(pushups!==prev){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
  }

  function applyState(d){
    if(!d||d.pair!==PAIR)return;
    var totalGoals=0;
    ['g1'].forEach(function(g){
      var h=d[g].home||0,a=d[g].away||0;
      totalGoals+=h+a;
      document.getElementById(g+'-home').textContent=h;
      document.getElementById(g+'-away').textContent=a;
      var lbl=STATUS_LABELS[d[g].statusIdx]||'Pre-Match';
      var el=document.getElementById(g+'-status');
      el.textContent=lbl;
      el.className='sb-status'+(lbl==='LIVE'?' live':lbl==='Half Time'?' ht':'');
      var c=d[g].clock||{running:false,base:0,startedAt:0};
      clocks[g]={running:c.running,base:c.base,startedAt:c.startedAt};
    });
    updatePushups(totalGoals);
  }

  function poll(){
    fetch(API,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}})
      .then(function(r){return r.json();})
      .then(function(d){if(d&&d[0])applyState(JSON.parse(d[0].data));})
      .catch(function(){});
  }

  setInterval(function(){
    ['g1'].forEach(function(g){
      var el=document.getElementById(g+'-clock');
      el.textContent=fmtSecs(currentSecs(g));
      el.className='sb-clock'+(clocks[g].running?' running':'');
    });
  },500);

  poll(); setInterval(poll,2000);

  function pollSubs(){
    fetch('https://api.twitch.tv/helix/subscriptions?broadcaster_id=1508126715&first=1',{
      headers:{'Client-Id':'d4anlmidokt295jqvvtixt0tarzvkb','Authorization':'Bearer dsvcnmtdsh2ib2rfdywat0zsapaol5'}
    }).then(function(r){return r.json();})
    .then(function(d){
      if(d&&typeof d.total==='number'){
        var pct=Math.min(100,(d.total/1000)*100);
        document.getElementById('sub-count').textContent=d.total+' / 1000';
        document.getElementById('sub-fill').style.width=pct.toFixed(1)+'%';
      }
    }).catch(function(){});
  }
  pollSubs(); setInterval(pollSubs,30000);

  var msgs=[],MAX_MSGS=3;
  var COLORS=['#ff9f9f','#9fff9f','#9f9fff','#ffd49f','#d49fff','#9fffff','#ff9fd4','#ffff9f'];
  var userColors={};
  function getUserColor(n){if(!userColors[n]){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))&0xffffffff;userColors[n]=COLORS[Math.abs(h)%COLORS.length];}return userColors[n];}
  function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function addMessage(u,t){
    var c=document.getElementById('chat-messages');
    var d=document.createElement('div');d.className='chat-msg';
    d.innerHTML='<span class="username" style="color:'+getUserColor(u)+'">'+escHtml(u)+':</span><span class="text"> '+escHtml(t)+'</span>';
    c.appendChild(d);msgs.push(d);if(msgs.length>MAX_MSGS)msgs.shift().remove();
  }
  function connectChat(){
    var ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen=function(){ws.send('PASS oauth:twitch_anonymous');ws.send('NICK justinfan'+Math.floor(Math.random()*99999));ws.send('JOIN #contikolokotronis');};
    ws.onmessage=function(e){var r=e.data;if(r.indexOf('PING')===0){ws.send('PONG :tmi.twitch.tv');return;}var m=r.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.+)$/m);if(m)addMessage(m[1],m[2].trim());};
    ws.onclose=function(){setTimeout(connectChat,3000);};ws.onerror=function(){ws.close();};
  }
  connectChat();
</script>
</body></html>
